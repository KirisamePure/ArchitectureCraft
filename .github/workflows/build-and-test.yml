name: Build and test Fabric
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecturecraft-fabric
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/test-results/
